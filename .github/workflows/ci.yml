name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: 安装后端依赖
        run: npm ci
        working-directory: server

      - name: 安装前端依赖
        run: npm ci
        working-directory: web

      - name: 安装本地判题工具链
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 python-is-python3 openjdk-17-jdk-headless

      - name: 构建隔离判题镜像
        run: docker build -t oj-judge:test -f server/docker/judge.Dockerfile server/docker

      - name: 配置真实 Docker 判题回归
        run: echo "JUDGE_DOCKER_IMAGE=oj-judge:test" >> "$GITHUB_ENV"

      - name: 后端类型检查
        run: npx tsc --noEmit
        working-directory: server

      - name: 前端类型检查
        run: npx tsc --noEmit
        working-directory: web

      - name: 后端单元测试
        working-directory: server
        run: |
          set +e
          npm test > ../server-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            detail=$(awk '/^ *not ok/{f=1} f' ../server-test.log | head -45 | tr '\n' ' ' | tr -s ' ' | sed 's/%/%25/g' | cut -c1-1200)
            echo "::error title=server-tests::${detail}"
            echo "===== tail of server tests ====="
            tail -80 ../server-test.log
          else
            tail -3 ../server-test.log
          fi
          exit "$status"

      - name: 前端单元测试
        run: npm test
        working-directory: web
